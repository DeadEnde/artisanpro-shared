name: Auto-Coordinator - Assign Tasks to Agents

on:
  push:
    branches: [main]
    paths:
      - 'bridge/tasks.json'
      - 'bridge/state.json'
      - 'bridge/locks.json'
      - 'types/**'
      - 'constants/**'
      - 'supabase/**'
      - 'utils/**'
  workflow_dispatch:
  schedule:
    # Check every 30 minutes even if no push (catches stuck tasks)
    - cron: '*/30 * * * *'

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Auto-Coordinator
        id: coordinator
        run: |
          node scripts/auto-assign.js
          echo "Coordinator finished"
          if [ -f bridge/tasks.json ]; then
            cat bridge/tasks.json | python3 -m json.tool | head -n 100
          fi

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Commit and push auto-assignments
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "ArtisanPro Auto-Coordinator"
          git config user.email "coordinator@artisanpro.bot"
          git add bridge/tasks.json bridge/locks.json bridge/state.json
          git commit -m "auto: assign next tasks based on dependencies [skip ci]

          Auto-assigned by coordinator:
          - Checked done tasks and released locks
          - Assigned tasks where dependencies met
          - Updated state.json

          Triggered by push from ${{ github.actor }} at ${{ github.sha }}"
          git push

      - name: Create Issues for newly assigned tasks
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse newly assigned tasks and create issues
          ASSIGNED=$(cat bridge/tasks.json | python3 -c "
          import json
          data=json.load(open('bridge/tasks.json'))
          for t in data['tasks']:
              if t['status']=='in_progress' and 'claimedAt' in t:
                  # Check if claimed in last 5 minutes
                  from datetime import datetime, timezone
                  try:
                      claimed = datetime.fromisoformat(t['claimedAt'].replace('Z','+00:00'))
                      now = datetime.now(timezone.utc)
                      if (now - claimed).total_seconds() < 400:
                          print(f\"{t['id']}|{t['title']}|{t['assignee']}|{t['priority']}|{t['role']}\")
                  except:
                      pass
          ")
          echo "$ASSIGNED" | while IFS='|' read id title assignee priority role; do
            if [ -n "$id" ]; then
              echo "Creating issue for $id"
              gh issue create --title "[$priority] $title - $id" --body "
          ## Auto-Assigned Task

          **Task ID:** $id
          **Title:** $title
          **Assignee:** $assignee
          **Role:** $role
          **Priority:** $priority

          This task was auto-assigned by the coordinator because dependencies are met.

          ### Instructions
          1. Check \`bridge/tasks.json\` for full details
          2. Check \`bridge/locks.json\` for your locked files
          3. Check \`bridge/agents.md\` for your role definition
          4. Claim files, code, test build, update tasks.json when done
          5. Push - coordinator will auto-assign next tasks

          ### Files
          See tasks.json -> claimedFiles for this task

          ### Acceptance Criteria
          See tasks.json -> acceptanceCriteria

          ---
          Auto-generated by ArtisanPro Auto-Coordinator at $(date -u)
          Triggered by push ${{ github.sha }} from ${{ github.actor }}
              " --label "auto-assigned,$role,$priority" || echo "Failed to create issue for $id (may already exist)"
            fi
          done

      - name: Summary
        run: |
          echo "## 🤖 Auto-Coordinator Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }} - ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current Tasks Status" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat bridge/tasks.json | python3 -m json.tool | head -n 150 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Active Locks" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat bridge/locks.json | python3 -m json.tool >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
